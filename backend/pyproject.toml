[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paynest-backend"
version = "0.1.0"
description = "PayNest AI Support Intelligence Platform - API and processing services"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.14,<2",
  "pgvector>=0.3.6,<1.0",
  "argon2-cffi>=23.1,<26",
  "pyjwt>=2.10,<3",
  "cryptography>=44,<47",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "httpx>=0.28,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["ingested: tests sharing one full ingestion of the source data (skips per-test cleanup)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/**" = ["E501"]
"app/services/approvals/service.py" = ["E501"]
"app/api/v1/monitor.py" = ["E501"]
"app/services/evaluation/gates.py" = ["E501"]  # compact SQL
"app/api/v1/analytics.py" = ["E501"]  # SQL and notes  # compact stage tables  # compact evidence-pack literals

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
