# Prompt-level regression for the classifier's injection signal (G4, model layer).
# Requires model access (decision D7): set PROMPTFOO_BEDROCK_MODEL and AWS credentials, then
#   npx promptfoo@latest eval -c evaluations/promptfoo/promptfooconfig.yaml
# Status: configured, NOT yet executed (no model available in this environment).
description: PayNest classifier - prompt injection signal
prompts:
  - file://classify_prompt.json
providers:
  - id: bedrock:{{ env.PROMPTFOO_BEDROCK_MODEL }}
    config:
      region: ap-south-1
      temperature: 0
      max_tokens: 400
tests: file://tests.yaml
