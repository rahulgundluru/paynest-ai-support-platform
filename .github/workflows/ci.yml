name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: paynest_test
          POSTGRES_USER: paynest
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paynest -d paynest_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://paynest:ci-only-password@localhost:5432/paynest_test
      DATABASE_URL: postgresql+asyncpg://paynest:ci-only-password@localhost:5432/paynest_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Fetch pinned source case data (public upstream, not committed here)
        working-directory: .
        run: python scripts/source_data.py fetch
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app
      - name: Migrations are reversible
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  evaluations:
    # Runs the deterministic evaluation gates on the real (synthetic) case data. A critical gate
    # (G1 PII, G4 injection, G5 effective dates, G6 output validation) failing blocks the build.
    runs-on: ubuntu-latest
    needs: [backend]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: paynest_eval
          POSTGRES_USER: paynest
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paynest -d paynest_eval"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://paynest:ci-only-password@localhost:5432/paynest_eval
      DATA_SOURCE_DIR: ${{ github.workspace }}/data/source
      APP_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e .
      - name: Fetch pinned source case data
        working-directory: .
        run: python scripts/source_data.py fetch
      - name: Generate ephemeral secrets for this run
        run: |
          echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "PII_VAULT_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Build the pipeline state
        run: |
          alembic upgrade head
          python -m app.cli ingest
          python -m app.cli index-knowledge
          python -m app.cli detect-duplicates
          python -m app.cli route-all
          python -m app.cli build-review-queue
      - name: Evaluation gates
        run: python -m app.cli evaluate --report evaluation-report.md --fail-on-critical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: backend/evaluation-report.md

  promptfoo:
    # Model-layer injection regression. Runs only when model access is configured (decision D7).
    runs-on: ubuntu-latest
    needs: [backend]
    env:
      PROMPTFOO_BEDROCK_MODEL: ${{ vars.PROMPTFOO_BEDROCK_MODEL }}
      AWS_ROLE_ARN: ${{ vars.AWS_EVAL_ROLE_ARN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Skip when no model is configured
        if: env.PROMPTFOO_BEDROCK_MODEL == '' || env.AWS_ROLE_ARN == ''
        run: echo "No model configured (D7); Promptfoo regression not run."
      - uses: aws-actions/configure-aws-credentials@v4
        if: env.PROMPTFOO_BEDROCK_MODEL != '' && env.AWS_ROLE_ARN != ''
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Promptfoo
        if: env.PROMPTFOO_BEDROCK_MODEL != '' && env.AWS_ROLE_ARN != ''
        run: npx --yes promptfoo@0.103.0 eval -c evaluations/promptfoo/promptfooconfig.yaml --no-cache

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t paynest-api:ci backend
      - name: Build frontend image
        run: docker build -t paynest-web:ci frontend
